<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extra Deuce Wild</title>
  <meta name="description" content="Extra Deuce Wild: tennis, played with cards. A playtest build that runs in your browser.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    :root {
      --bg: #0e1114;
      --panel: #151a1f;
      --text: #d8dee4;
      --muted: #8b949e;
      --accent: #e3b341;
      --button: #21262d;
      --button-hover: #30363d;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 16px;
    }
    header, main, footer { width: 100%; max-width: 900px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.08em; color: var(--accent); }
    header p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    header a { color: var(--muted); }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 10px; }
    #terminal {
      flex: 1; min-height: 240px; display: flex; background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px; overflow: hidden;
    }
    /* xterm measures its parent to fit rows, so the parent has no padding. */
    #screen { flex: 1; min-width: 0; min-height: 0; }
    /* xterm's scroll area: match the panel, no light scrollbar track. */
    .xterm .xterm-viewport { background-color: var(--panel) !important; scrollbar-color: var(--border) var(--panel); }
    #keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #keys button, #again {
      font: 600 1rem ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
      min-width: 2.6rem; height: 2.6rem; padding: 0 0.7rem;
      color: var(--text); background: var(--button);
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
      touch-action: manipulation;
    }
    #keys button:hover, #again:hover { background: var(--button-hover); }
    #keys .wide { min-width: 5rem; }
    #keys .gap { flex-basis: 0.4rem; }
    #ended { display: none; margin-top: 10px; align-items: center; gap: 12px; color: var(--muted); }
    #ended.show { display: flex; }
    #again { color: var(--accent); }
    @media (max-width: 520px) {
      body { padding: 8px 10px; }
      header p { font-size: 0.8rem; }
      #keys { gap: 5px; }
      #keys button { min-width: 2.3rem; height: 2.4rem; padding: 0 0.5rem; }
      #keys .gap { display: none; }
    }
    footer { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>EXTRA DEUCE WILD</h1>
    <p>Playtest build. Type a number and press Enter, or tap the keys. <kbd>h</kbd> for help.</p>
  </header>
  <main>
    <div id="terminal" aria-label="Game terminal"><div id="screen"></div></div>
    <div id="keys" aria-label="Quick keys">
      <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button>
      <button>6</button><button>7</button><button>8</button><button>9</button>
      <span class="gap"></span>
      <button>y</button><button>n</button><button>a</button><button>r</button>
      <span class="gap"></span>
      <button>b</button><button>h</button><button class="wide" data-line="">Enter</button>
    </div>
    <div id="ended"><span>Thanks for playing.</span><button id="again">Play again</button></div>
  </main>
  <footer>Runs entirely in your browser. Every match prints a seed, so a match can be replayed.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-canvas@0.7.0/lib/addon-canvas.js"></script>
  <script src="deuce.js"></script>
  <script>
    (() => {
      const box = document.getElementById('screen');
      const fontFamily = 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace';

      // 80 columns if they fit at a readable size (12px or more); on a phone,
      // 12px and as many columns as fit (the game wraps to fit).
      const charWidth = (size) => {
        const probe = document.createElement('span');
        probe.style.cssText = `font: ${size}px ${fontFamily}; position: absolute; visibility: hidden; white-space: pre`;
        probe.textContent = 'M'.repeat(100);
        document.body.appendChild(probe);
        const w = probe.getBoundingClientRect().width / 100;
        probe.remove();
        return w;
      };
      const inner = box.clientWidth - 14;  // Room for the scrollbar.
      let fontSize = 18;
      while (fontSize > 12 && charWidth(fontSize) * 80 > inner) fontSize -= 0.5;
      const term = new Terminal({
        fontSize, fontFamily, lineHeight: 1.1,
        convertEol: true, cursorBlink: true, scrollback: 5000,
        theme: { background: '#151a1f', foreground: '#d8dee4', cursor: '#e3b341' },
      });
      term.open(box);
      // Draw with WebGL (or canvas): they draw box-drawing characters
      // themselves, so card borders join up; browser fonts leave gaps.
      try {
        term.loadAddon(new WebglAddon.WebglAddon());
      } catch {
        try { term.loadAddon(new CanvasAddon.CanvasAddon()); } catch { /* The DOM renderer still works. */ }
      }
      // Fill the box, but never wider than the game's 80 columns.
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      const size = fit.proposeDimensions() ?? { cols: 80, rows: 30 };
      const cols = Math.max(40, Math.min(80, size.cols));
      term.resize(cols, Math.max(12, size.rows));
      // Keep the rows fitted when the window changes (a phone's address bar
      // hides, a rotation). The columns stay: the game wraps to them.
      new ResizeObserver(() => {
        const rows = fit.proposeDimensions()?.rows;
        if (rows && rows !== term.rows) term.resize(cols, Math.max(12, rows));
      }).observe(box);
      term.focus();
      window.deuceTerminal = term;  // For automated tests and debugging.

      // Lines typed or tapped, waiting for the game to ask for one.
      const lines = [];
      let waiting = null;  // The game's pending request, if any.
      let typed = '';
      const submit = (line) => {
        if (waiting) {
          const resolve = waiting;
          waiting = null;
          resolve(line);
        } else {
          lines.push(line);
        }
      };
      term.onData((data) => {
        for (const ch of data) {
          if (ch === '\r') {
            term.write('\r\n');
            const line = typed;
            typed = '';
            submit(line);
          } else if (ch === '\x7f' || ch === '\b') {
            if (typed.length) {
              typed = typed.slice(0, -1);
              term.write('\b \b');
            }
          } else if (ch >= ' ' && ch !== '\x7f') {
            typed += ch;
            term.write(ch);
          }
        }
      });
      document.getElementById('keys').addEventListener('click', (e) => {
        const button = e.target.closest('button');
        if (!button) return;
        // A tap replaces anything half typed.
        const line = button.dataset.line ?? button.textContent;
        term.write('\b \b'.repeat(typed.length) + line + '\r\n');
        typed = '';
        submit(line);
        term.focus();
      });

      // For testing: ?inputs=1,1,2 plays those lines first.
      const scripted = new URLSearchParams(location.search).get('inputs');
      if (scripted !== null) lines.push(...scripted.split(','));

      createDeuce({
        deuceWrite: (text) => term.write(text),
        deuceReadLine: () => new Promise((resolve) => {
          if (lines.length) {
            const line = lines.shift();
            term.write(line + '\r\n');
            resolve(line);
          } else {
            waiting = resolve;
          }
        }),
        deuceColumns: () => cols,
        onExit: () => {
          document.getElementById('keys').style.display = 'none';
          document.getElementById('ended').classList.add('show');
        },
      });
      document.getElementById('again').addEventListener('click', () => location.reload());
    })();
  </script>
</body>
</html>
